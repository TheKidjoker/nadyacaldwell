<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Nightfall, at 16px. The retired coastal flower lived here until now.
       Geometric rather than cursive on purpose: Parisienne turns to mud below
       about 32px, and a favicon is read at 16. The lockup echoes the wordmark
       though: the letter, then the one warm hairline beneath it.

       NOTE: token names are written without their leading dashes below. An XML
       comment may not contain a double hyphen, so writing them the CSS way
       makes this file malformed and the browser silently refuses to render it. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <!-- night over night-deep, the page's own gradient -->
      <stop offset="0" stop-color="#0f2438"/>
      <stop offset="1" stop-color="#071320"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ground)"/>

  <!-- blue-light: her blue, promoted to the mark -->
  <path
    d="M14 43 L14 13 L21 13 L43 36 L43 13 L50 13 L50 43 L43 43 L21 20 L21 43 Z"
    fill="#9ac5e7"/>

  <!-- warm: the single champagne hairline, exactly as under her name -->
  <rect x="20" y="48" width="24" height="2.6" rx="1.3" fill="#b08d57"/>
</svg>
